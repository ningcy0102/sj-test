<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Junior Album Collection</title>
<style>
body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#0f2d5c;
  color:white;
  padding:28px 16px 22px;
  text-align:center;
}
h1{
  margin:0;
  font-size:26px;
  letter-spacing:1px;
}
.sub{
  margin-top:8px;
  color:#dbeafe;
  font-size:14px;
}
main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.progressBox{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 14px #0001;
  margin-bottom:16px;
}
.progressText{
  font-size:22px;
  font-weight:bold;
  color:#0f2d5c;
}
.bar{
  height:15px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}
.bar div{
  height:100%;
  width:0;
  background:#1d4ed8;
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:16px;
}
.tabs button{
  border:0;
  background:white;
  color:#0f2d5c;
  padding:10px 16px;
  border-radius:999px;
  font-weight:bold;
  box-shadow:0 3px 10px #0001;
}
.tabs button.active{
  background:#0f2d5c;
  color:white;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 14px #0001;
  border:1px solid #e5e7eb;
}
.cover{
  height:155px;
  background:linear-gradient(135deg,#0f2d5c,#60a5fa);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
  padding:12px;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(100%) brightness(70%);
  transition:0.3s;
}
.cover img.owned{
  filter:none;
}
.info{
  padding:12px;
}
.album{
  font-weight:bold;
  color:#0f2d5c;
  font-size:15px;
}
.meta{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}
.heart{
  margin-top:10px;
  width:100%;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:999px;
  padding:8px;
  font-weight:bold;
}
.heart.owned{
  background:#1d4ed8;
  color:white;
}
</style>
</head>

<body>
<header>
  <h1>SUPER JUNIOR ALBUM COLLECTION</h1>
  <div class="sub">每個人的收藏紀錄會存在自己的瀏覽器，不用登入，也不會互相影響。</div>
</header>

<main>
  <section class="progressBox">
    <div>總收藏進度</div>
    <div id="progressText" class="progressText">0 / 0</div>
    <div class="bar"><div id="bar"></div></div>
  </section>

<div class="tabs">
  <button class="active" onclick="setFilter('ALL',this)">ALL</button>
  <button onclick="setFilter('Group',this)">GROUP</button>
  <button onclick="setFilter('Unit',this)">UNIT</button>
  <button onclick="setFilter('Solo',this)">SOLO</button>
</div>

<div id="artistTabs" class="tabs"></div>

<div id="countryTabs" class="tabs"></div>

  <section id="grid" class="grid"></section>
</main>

<script>
const albums=[
  {id:"sj05",cat:"Group",artist:"Super Junior",album:"Super Junior 05",ver:"Regular",country:"Korea",year:"2005"},
  {id:"dontdon-a",cat:"Group",artist:"Super Junior",album:"Don't Don",ver:"Version A",country:"Korea",year:"2007"},
  {id:"sorry-a",cat:"Group",artist:"Super Junior",album:"Sorry, Sorry",ver:"Version A",country:"Korea",year:"2009"},
  {id:"sorry-b",cat:"Group",artist:"Super Junior",album:"Sorry, Sorry",ver:"Version B",country:"Korea",year:"2009"},
  {id:"sorry-c",cat:"Group",artist:"Super Junior",album:"Sorry, Sorry",ver:"Version C",country:"Korea",year:"2009"},
  {id:"bonamana-a",cat:"Group",artist:"Super Junior",album:"Bonamana",ver:"Version A",country:"Korea",year:"2010"},
  {id:"bonamana-b",cat:"Group",artist:"Super Junior",album:"Bonamana",ver:"Version B",country:"Korea",year:"2010"},
  {id:"mr-simple-a",cat:"Group",artist:"Super Junior",album:"Mr. Simple",ver:"Version A",country:"Korea",year:"2011"},
  {id:"mamacita-a",cat:"Group",artist:"Super Junior",album:"Mamacita",ver:"Version A",country:"Korea",year:"2014"},
  {id:"play-black",cat:"Group",artist:"Super Junior",album:"PLAY",ver:"Black Suit Ver",country:"Korea",year:"2017"},
  {id:"renaissance-yesung",cat:"Group",artist:"Super Junior",album:"The Renaissance",ver:"Yesung Ver",country:"Korea",year:"2021"},

  {id:"de-oppa",cat:"Unit",artist:"D&E",album:"Oppa, Oppa",ver:"Regular",country:"Korea",year:"2011"},
  {id:"de-countdown",cat:"Unit",artist:"D&E",album:"COUNTDOWN",ver:"Regular",country:"Japan",year:"2021"},

  {id:"yesung-here-i-am",cat:"Solo",artist:"Yesung",album:"Here I Am",ver:"Regular",country:"Korea",year:"2016"},
{id:"yesung-spring-falling",cat:"Solo",artist:"Yesung",album:"Spring Falling",ver:"Regular",country:"Korea",year:"2017"},
{id:"yesung-pink-magic-magic",cat:"Solo",artist:"Yesung",album:"Pink Magic",ver:"Magic Ver",country:"Korea",year:"2019",image:"images/pink-magic-magic.jpg"},
{id:"yesung-pink-magic-pink",cat:"Solo",artist:"Yesung",album:"Pink Magic",ver:"Pink Ver",country:"Korea",year:"2019",image:"images/pink-magic-pink.jpg"},
{id:"yesung-beautiful-night",cat:"Solo",artist:"Yesung",album:"Beautiful Night",ver:"Regular",country:"Korea",year:"2021"},
{id:"yesung-sensory-flows",cat:"Solo",artist:"Yesung",album:"Sensory Flows",ver:"Regular",country:"Korea",year:"2023"},
{id:"yesung-floral-sense",cat:"Solo",artist:"Yesung",album:"Floral Sense",ver:"Regular",country:"Korea",year:"2023"},
{id:"yesung-unfading-sense-diary",cat:"Solo",artist:"Yesung",album:"Unfading Sense",ver:"Diary Ver",country:"Korea",year:"2023"},
{id:"yesung-unfading-sense-memory",cat:"Solo",artist:"Yesung",album:"Unfading Sense",ver:"Memory Ver",country:"Korea",year:"2023"},
{id:"yesung-its-complicated",cat:"Solo",artist:"Yesung",album:"It's Complicated",ver:"Regular",country:"Korea",year:"2025"}
];

let current="ALL";
let currentArtist="ALL";
let currentCountry="ALL";
const key="sj_album_";

function isOwned(id){
  return localStorage.getItem(key+id)==="true";
}

function toggle(id){
  localStorage.setItem(key+id,!isOwned(id));
  render();
}

function setFilter(cat,btn){
  current=cat;
  currentArtist="ALL";
  currentCountry="ALL";

  document.querySelectorAll("main > .tabs:first-of-type button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderSubTabs();
  render();
}

function renderSubTabs(){
  const artistTabs=document.getElementById("artistTabs");
  const countryTabs=document.getElementById("countryTabs");

  artistTabs.innerHTML="";
  countryTabs.innerHTML="";

  if(current==="Solo"){
    artistTabs.innerHTML=`
      <button class="active" onclick="setArtist('ALL',this)">ALL SOLO</button>
      <button onclick="setArtist('Yesung',this)">Yesung</button>
      <button onclick="setArtist('Kyuhyun',this)">Kyuhyun</button>
      <button onclick="setArtist('Ryeowook',this)">Ryeowook</button>
      <button onclick="setArtist('Donghae',this)">Donghae</button>
      <button onclick="setArtist('Eunhyuk',this)">Eunhyuk</button>
    `;
  }

  if(current==="Unit"){
    artistTabs.innerHTML=`
      <button class="active" onclick="setArtist('ALL',this)">ALL UNIT</button>
      <button onclick="setArtist('D&E',this)">D&E</button>
      <button onclick="setArtist('K.R.Y.',this)">K.R.Y.</button>
      <button onclick="setArtist('M',this)">M</button>
      <button onclick="setArtist('T',this)">T</button>
      <button onclick="setArtist('H',this)">H</button>
      <button onclick="setArtist('L.S.S.',this)">L.S.S.</button>
    `;
  }

  if(current==="Group"){
    showCountryTabs();
  }
}

function setArtist(artist,btn){
  currentArtist=artist;
  currentCountry="ALL";

  document.querySelectorAll("#artistTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  showCountryTabs();
  render();
}

function showCountryTabs(){
  const countryTabs=document.getElementById("countryTabs");

  countryTabs.innerHTML=`
    <button class="active" onclick="setCountry('ALL',this)">ALL COUNTRY</button>
    <button onclick="setCountry('Korea',this)">Korea</button>
    <button onclick="setCountry('Japan',this)">Japan</button>
    <button onclick="setCountry('Taiwan',this)">Taiwan</button>
  `;
}

function setCountry(country,btn){
  currentCountry=country;

  document.querySelectorAll("#countryTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  render();
}

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

let list=albums;

if(current!=="ALL"){
  list=list.filter(a=>a.cat===current);
}

if(currentArtist!=="ALL"){
  list=list.filter(a=>a.artist===currentArtist);
}

if(currentCountry!=="ALL"){
  list=list.filter(a=>a.country===currentCountry);
}

  list.forEach(a=>{
    const owned=isOwned(a.id);

    grid.innerHTML += `
      <div class="card">
        <div class="cover">
          ${
            a.image
            ? `<img src="${a.image}" class="${owned ? 'owned' : ''}">`
            : `${a.album}<br>${a.ver}`
          }
        </div>

        <div class="info">
          <div class="album">${a.album}</div>
          <div class="meta">${a.artist}</div>
          <div class="meta">${a.ver}｜${a.country}｜${a.year}</div>

          <button class="heart ${owned ? 'owned' : ''}" onclick="toggle('${a.id}')">
            ${owned ? '♥ 已收藏' : '♡ 未收藏'}
          </button>
        </div>
      </div>
    `;
  });

  updateProgress();
}

function updateProgress(){
  const total=albums.length;
  const owned=albums.filter(a=>isOwned(a.id)).length;
  const percent=total?Math.round(owned/total*100):0;
  document.getElementById("progressText").innerText=`${owned} / ${total}（${percent}%）`;
  document.getElementById("bar").style.width=percent+"%";
}

render();
</script>
</body>
</html>
