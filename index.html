<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Junior Album Collection</title>

<style>
body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#0f2d5c;
  color:white;
  padding:28px 16px 22px;
  text-align:center;
}
h1{
  margin:0;
  font-size:26px;
  letter-spacing:1px;
}
.sub{
  margin-top:8px;
  color:#dbeafe;
  font-size:14px;
}
main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.progressBox{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 14px #0001;
  margin-bottom:16px;
}
.progressText{
  font-size:22px;
  font-weight:bold;
  color:#0f2d5c;
}
.bar{
  height:15px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}
.bar div{
  height:100%;
  width:0;
  background:#1d4ed8;
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}
.tabs button{
  border:0;
  background:white;
  color:#0f2d5c;
  padding:10px 16px;
  border-radius:999px;
  font-weight:bold;
  box-shadow:0 3px 10px #0001;
  white-space:nowrap;
}
.tabs button.active{
  background:#0f2d5c;
  color:white;
}
.albumHeader{
  background:white;
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 4px 14px #0001;
  margin:18px 0 16px;
}
.albumTitle{
  color:#0f2d5c;
  font-weight:bold;
  letter-spacing:3px;
  font-size:24px;
}
.albumSub{
  color:#64748b;
  font-size:13px;
  margin-top:6px;
}
.albumProgress{
  margin-top:10px;
  font-weight:bold;
  color:#1d4ed8;
}
.sectionName{
  color:#0f2d5c;
  font-weight:bold;
  margin:16px 0 10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 14px #0001;
  border:1px solid #e5e7eb;
}
.cover{
  height:155px;
  background:linear-gradient(135deg,#0f2d5c,#60a5fa);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
  padding:12px;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(100%) brightness(70%);
  transition:0.3s;
}
.cover img.owned{
  filter:none;
}
.info{
  padding:12px;
}
.album{
  font-weight:bold;
  color:#0f2d5c;
  font-size:15px;
}
.meta{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}
.heart{
  margin-top:10px;
  width:100%;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:999px;
  padding:8px;
  font-weight:bold;
}
.heart.owned{
  background:#1d4ed8;
  color:white;
}
.empty{
  text-align:center;
  color:#64748b;
  padding:30px 10px;
}
</style>
</head>

<body>

<header>
  <h1>SUPER JUNIOR ALBUM COLLECTION</h1>
  <div class="sub">每個人的收藏紀錄會存在自己的瀏覽器，不用登入，也不會互相影響。</div>
</header>

<main>

  <section class="progressBox">
    <div>總收藏進度</div>
    <div id="progressText" class="progressText">0 / 0</div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <div class="tabs">
    <button onclick="setMain('Super Junior',this)">Super Junior</button>
    <button onclick="setMain('Unit',this)">Unit</button>
    <button onclick="setMain('SOLO',this)">SOLO</button>
  </div>

  <div id="memberTabs" class="tabs"></div>
  <div id="countryTabs" class="tabs"></div>
  <div id="typeTabs" class="tabs"></div>

  <div id="albumHeader"></div>

  <section id="grid" class="grid"></section>

</main>

<script>
const albums=[
 {id:"yesung-here-i-am-normal", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你一輯", album:"Here I Am", version:"Normal Ver.",

{id:"yesung-pink-magic-smart-grey", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你三輯", album:"Pink Magic", version:"Smart Gray Ver.",
  year:"2019", image:"images/pink-magic-smart-gray.png"},
{id:"yesung-beautiful-night-beautiful", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你四輯", album:"Beautiful Night",

{id:"yesung-beautiful-night-night", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你四輯", album:"Beautiful Night",

{id:"yesung-sensory-flows-day1", main:"SOLO", member:"Yesung", country:"韓國", type:"正規一輯", album:"Sensory Flows", version:"Day 1 Ver.",

{id:"yesung-sensory-flows-day2", main:"SOLO", member:"Yesung", country:"韓國", type:"正規一輯", album:"Sensory Flows", version:"Day 2 Ver.",

{id:"yesung-floral-sense-normal", main:"SOLO", member:"Yesung", country:"韓國", type:"特別專輯", album:"Floral Sense", version:"Normal Ver.",
  year:"2023"},
{id:"yesung-floral-sense-lp", main:"SOLO", member:"Yesung",  country:"韓國", type:"特別專輯", album:"Floral Sense", version:"LP Ver.",
  year:"2023"},
{id:"yesung-unfading-sense-in", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你五輯", album:"Unfading Sense", version:"In Ver.",
  year:"2023"},
{id:"yesung-unfading-sense-out", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你五輯", album:"Unfading Sense", version:"Out Ver.",
  year:"2023"},
{id:"yesung-unfading-sense-tape", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你五輯", album:"Unfading Sense", version:"Tape Ver.",
  year:"2023"},
{id:"yesung-unfading-sense-special", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你五輯", album:"Unfading Sense",
  version:"Special Ver.", year:"2023"},
{id:"yesung-unfading-sense-lp", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你五輯", album:"Unfading Sense", version:"LP Ver.",
  year:"2023"},
{id:"yesung-its-complicated-things", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你六輯", album:"It's Complicated", version:"Things Ver.",
  year:"2024"},
{id:"yesung-its-complicated-feeling", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你六輯", album:"It's Complicated", version:"Feeling Ver.",
  year:"2024"},
{id:"yesung-its-complicated-out-special", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你六輯", album:"It's Complicated", version:"Out Special Ver.",
  year:"2024"},
{id:"yesung-its-complicated-smini", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你六輯", album:"It's Complicated", version:"SMini", year:"2024"
},
{id:"yesung-its-complicated-lp", main:"SOLO", member:"Yesung", country:"韓國", type:"迷你六輯", album:"It's Complicated", version:"LP Ver.",
  year:"2024"},

        {id:"yesung-story-regular", main:"SOLO", member:"Yesung", country:"日本", type:"正規1", album:"STORY", version:"Regular", year:"2019"}
];

const structure={
  "Super Junior":{
    countries:{
      "韓國":["正規1","單曲1","正規2","正規3","正規4","正規5","正規6","正規7","特別專輯","正規8","特別迷你專輯","正規9","正規10","特別單曲","正規11","正規12"],
      "日本":["改編單曲","特別單曲","二輯日版","三輯日版","單曲1","單曲2","單曲3","單曲4","正規1","單曲5","單曲6","單曲7","單曲8","單曲9","迷你1","正規2"]
    }
  },
  "Unit":{
    members:["K.R.Y.","T","Happy","M","D&E","L.S.S.","83z"],
    countries:{
      "K.R.Y.":{
        "韓國":[],
        "日本":["單曲1","單曲2","單曲3"]
      },
      "T":{
        "韓國":[],
        "日本":[]
      },
      "Happy":{},
      "M":{
        "韓國":[],
        "日本":[],
        "台灣":["正規1","迷你1","迷你2","正規2","迷你3"]
      },
      "D&E":{
        "韓國":["迷你1","迷你2","迷你3","迷你4","正規1","迷你5","迷你6"],
        "日本":["正規1","迷你1","正規2","迷你2"]
      },
      "L.S.S.":{
        "韓國":[],
        "日本":["單曲1","單曲2","迷你1","單曲3"]
      },
      "83z":{}
    }
  },
  "SOLO":{
    members:["Heechul","Yesung","Eunhyuk","Donghae","Ryeowook","Kyuhyun"],
    countries:{
      "Heechul":{},
      "Yesung":{
        "韓國":["迷你一輯","迷你二輯","迷你三輯","迷你四輯","正規一輯","特別專輯","迷你五輯","迷你六輯"],
        "日本":["單曲1","單曲2","正規1","迷你1","單曲4","正規2"]
      },
      "Eunhyuk":{
        "韓國":["迷你1"],
        "日本":["迷你1"]
      },
      "Donghae":{},
      "Ryeowook":{
        "韓國":["迷你1","迷你2","迷你3"],
        "日本":["單曲1","單曲2"]
      },
      "Kyuhyun":{
        "韓國":["迷你1","迷你2","迷你3","單曲1","單曲2","迷你4","EP1正規1","EP2"],
        "日本":["單曲1","正規1"]
      }
    }
  }
};

let currentMain="";
let currentMember="";
let currentCountry="";
let currentType="";

const key="sj_album_";

function isOwned(id){
  return localStorage.getItem(key+id)==="true";
}

function toggle(id){
  localStorage.setItem(key+id,!isOwned(id));
  render();
}

function setMain(main,btn){
  currentMain=main;
  currentMember="";
  currentCountry="";
  currentType="";

  document.querySelectorAll("main > .tabs:first-of-type button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setMember(member,btn){
  currentMember=member;
  currentCountry="";
  currentType="";

  document.querySelectorAll("#memberTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setCountry(country,btn){
  currentCountry=country;
  currentType="";

  document.querySelectorAll("#countryTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setType(type,btn){
  currentType=type;

  document.querySelectorAll("#typeTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  render();
}

function renderTabs(){
  const memberTabs=document.getElementById("memberTabs");
  const countryTabs=document.getElementById("countryTabs");
  const typeTabs=document.getElementById("typeTabs");

  memberTabs.innerHTML="";
  countryTabs.innerHTML="";
  typeTabs.innerHTML="";

  if(!currentMain) return;

  if(currentMain==="SOLO" || currentMain==="Unit"){
    const members=structure[currentMain].members;

    memberTabs.innerHTML=members.map(m=>`
      <button class="${currentMember===m?'active':''}" onclick="setMember('${m}',this)">${m}</button>
    `).join("");
  }

  if(currentMain==="Super Junior"){
    const countries=Object.keys(structure["Super Junior"].countries);

    countryTabs.innerHTML=countries.map(c=>`
      <button class="${currentCountry===c?'active':''}" onclick="setCountry('${c}',this)">${c}</button>
    `).join("");
  }

  if(currentMember){
    const countryObj=structure[currentMain].countries[currentMember] || {};
    const countries=Object.keys(countryObj);

    countryTabs.innerHTML=countries.map(c=>`
      <button class="${currentCountry===c?'active':''}" onclick="setCountry('${c}',this)">${c}</button>
    `).join("");
  }

  if(currentCountry){
    let types=[];

    if(currentMain==="Super Junior"){
      types=structure["Super Junior"].countries[currentCountry] || [];
    }else{
      types=(structure[currentMain].countries[currentMember] || {})[currentCountry] || [];
    }

    typeTabs.innerHTML=types.map(t=>`
      <button class="${currentType===t?'active':''}" onclick="setType('${t}',this)">${t}</button>
    `).join("");
  }
}

function getList(){
  return albums.filter(a=>{
    if(currentMain && a.main!==currentMain) return false;
    if(currentMember && a.member!==currentMember) return false;
    if(currentCountry && a.country!==currentCountry) return false;
    if(currentType && a.type!==currentType) return false;
    return true;
  });
}

function render(){
  const grid=document.getElementById("grid");
  const albumHeader=document.getElementById("albumHeader");

  grid.innerHTML="";
  albumHeader.innerHTML="";

  if(!currentMain){
    grid.innerHTML=`<div class="empty">請先選擇主項目</div>`;
    updateProgress();
    return;
  }

  if((currentMain==="SOLO" || currentMain==="Unit") && !currentMember){
    grid.innerHTML=`<div class="empty">請選擇成員或小分隊</div>`;
    updateProgress();
    return;
  }

  if(needsCountry() && !currentCountry){
    grid.innerHTML=`<div class="empty">請選擇國家</div>`;
    updateProgress();
    return;
  }

  if(needsType() && !currentType){
    grid.innerHTML=`<div class="empty">請選擇專輯分類</div>`;
    updateProgress();
    return;
  }

  const list=getList();

  if(list.length===0){
    grid.innerHTML=`<div class="empty">目前沒有資料</div>`;
    updateProgress();
    return;
  }

  const albumName=list[0].album;
  const albumYear=list[0].year;
  const ownedCount=list.filter(a=>isOwned(a.id)).length;
  const totalCount=list.length;

  albumHeader.innerHTML=`
    <div class="albumHeader">
      <div class="albumTitle">${albumName.toUpperCase()}</div>
      <div class="albumSub">${currentMember || currentMain}｜${currentCountry || ""}｜${currentType || ""}｜${albumYear}</div>
      <div class="albumProgress">${ownedCount} / ${totalCount} Versions</div>
    </div>
  `;

  list.forEach(a=>{
    const owned=isOwned(a.id);

    grid.innerHTML += `
      <div class="card">
        <div class="cover">
          ${
            a.image
            ? `<img src="${a.image}" class="${owned ? 'owned' : ''}">`
            : `${a.album}<br>${a.version}`
          }
        </div>

        <div class="info">
          <div class="album">${a.version}</div>
          <div class="meta">${a.album}</div>
          <div class="meta">${a.member || a.main}｜${a.country}｜${a.year}</div>

          <button class="heart ${owned ? 'owned' : ''}" onclick="toggle('${a.id}')">
            ${owned ? '♥ 已收藏' : '♡ 未收藏'}
          </button>
        </div>
      </div>
    `;
  });

  updateProgress();
}

function needsCountry(){
  if(currentMain==="Super Junior") return true;

  if(currentMain==="SOLO" || currentMain==="Unit"){
    const obj=structure[currentMain].countries[currentMember] || {};
    return Object.keys(obj).length>0;
  }

  return false;
}

function needsType(){
  if(!currentCountry) return false;

  if(currentMain==="Super Junior"){
    return (structure["Super Junior"].countries[currentCountry] || []).length>0;
  }

  if(currentMain==="SOLO" || currentMain==="Unit"){
    const types=(structure[currentMain].countries[currentMember] || {})[currentCountry] || [];
    return types.length>0;
  }

  return false;
}

function updateProgress(){
  const total=albums.length;
  const owned=albums.filter(a=>isOwned(a.id)).length;
  const percent=total?Math.round(owned/total*100):0;

  document.getElementById("progressText").innerText=`${owned} / ${total}（${percent}%）`;
  document.getElementById("bar").style.width=percent+"%";
}

renderTabs();
render();
</script>

</body>
</html>
