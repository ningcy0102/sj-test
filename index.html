<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Junior Album Collection</title>

<style>
body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#0f2d5c;
  color:white;
  padding:28px 16px 22px;
  text-align:center;
}
h1{
  margin:0;
  font-size:26px;
  letter-spacing:1px;
}
.sub{
  margin-top:8px;
  color:#dbeafe;
  font-size:14px;
}
main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.progressBox{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 14px #0001;
  margin-bottom:16px;
}
.progressText{
  font-size:22px;
  font-weight:bold;
  color:#0f2d5c;
}
.bar{
  height:15px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}
.bar div{
  height:100%;
  width:0;
  background:#1d4ed8;
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}
.tabs button{
  border:0;
  background:white;
  color:#0f2d5c;
  padding:10px 16px;
  border-radius:999px;
  font-weight:bold;
  box-shadow:0 3px 10px #0001;
  white-space:nowrap;
}
.tabs button.active{
  background:#0f2d5c;
  color:white;
}
.albumHeader{
  background:white;
  border-radius:18px;
  padding:18px;
  text-align:center;
  box-shadow:0 4px 14px #0001;
  margin:18px 0 16px;
}
.albumTitle{
  color:#0f2d5c;
  font-weight:bold;
  letter-spacing:3px;
  font-size:24px;
}
.albumSub{
  color:#64748b;
  font-size:13px;
  margin-top:6px;
}
.albumProgress{
  margin-top:10px;
  font-weight:bold;
  color:#1d4ed8;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 14px #0001;
  border:1px solid #e5e7eb;
}
.cover{
  height:155px;
  background:linear-gradient(135deg,#0f2d5c,#60a5fa);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
  padding:12px;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(100%) brightness(70%);
  transition:0.3s;
}
.cover img.owned{
  filter:none;
}
.info{
  padding:12px;
}
.album{
  font-weight:bold;
  color:#0f2d5c;
  font-size:15px;
}
.meta{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}
.heart{
  margin-top:10px;
  width:100%;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:999px;
  padding:8px;
  font-weight:bold;
}
.heart.owned{
  background:#1d4ed8;
  color:white;
}
.empty{
  text-align:center;
  color:#64748b;
  padding:30px 10px;
}
</style>
</head>

<body>

<header>
  <h1>SUPER JUNIOR ALBUM COLLECTION</h1>
  <div class="sub">每個人的收藏紀錄會存在自己的瀏覽器，不用登入，也不會互相影響。</div>
</header>

<main>

  <section class="progressBox">
    <div>總收藏進度</div>
    <div id="progressText" class="progressText">0 / 0</div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <div class="tabs">
    <button class="active" onclick="setMain('ALL',this)">ALL</button>
    <button onclick="setMain('Group',this)">GROUP</button>
    <button onclick="setMain('Unit',this)">UNIT</button>
    <button onclick="setMain('Solo',this)">SOLO</button>
  </div>

  <div id="artistTabs" class="tabs"></div>
  <div id="countryTabs" class="tabs"></div>
  <div id="typeTabs" class="tabs"></div>

  <div id="albumHeader"></div>

  <section id="grid" class="grid"></section>

</main>

<script>
const albums=[
  {
    id:"yesung-here-i-am-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你一輯",
    album:"Here I Am",
    ver:"Regular",
    year:"2016"
  },
  {
    id:"yesung-spring-falling-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你二輯",
    album:"Spring Falling",
    ver:"Regular",
    year:"2017"
  },
  {
    id:"yesung-pink-magic-magic",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你三輯",
    album:"Pink Magic",
    ver:"Magic Ver",
    year:"2019",
    image:"images/pink-magic-magic.jpg"
  },
  {
    id:"yesung-pink-magic-pink",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你三輯",
    album:"Pink Magic",
    ver:"Pink Ver",
    year:"2019",
    image:"images/pink-magic-pink.jpg"
  },
  {
    id:"yesung-beautiful-night-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你四輯",
    album:"Beautiful Night",
    ver:"Regular",
    year:"2021"
  },
  {
    id:"yesung-unfading-sense-diary",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你五輯",
    album:"Unfading Sense",
    ver:"Diary Ver",
    year:"2023"
  },
  {
    id:"yesung-unfading-sense-memory",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你五輯",
    album:"Unfading Sense",
    ver:"Memory Ver",
    year:"2023"
  },
  {
    id:"yesung-its-complicated-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"迷你六輯",
    album:"It's Complicated",
    ver:"Regular",
    year:"2024"
  },
  {
    id:"yesung-sensory-flows-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"正規一輯",
    album:"Sensory Flows",
    ver:"Regular",
    year:"2023"
  },
  {
    id:"yesung-floral-sense-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Korea",
    type:"特別專輯",
    album:"Floral Sense",
    ver:"Regular",
    year:"2023"
  },
  {
    id:"yesung-story-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Japan",
    type:"日本正規一輯",
    album:"STORY",
    ver:"Regular",
    year:"2019"
  },
  {
    id:"yesung-ame-nochi-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Japan",
    type:"日本單曲",
    album:"雨のち晴れの空の色",
    ver:"Regular",
    year:"2016"
  },
  {
    id:"yesung-splash-regular",
    cat:"Solo",
    artist:"Yesung",
    country:"Japan",
    type:"日本單曲",
    album:"Splash",
    ver:"Regular",
    year:"2017"
  }
];

let currentCat="ALL";
let currentArtist="";
let currentCountry="";
let currentType="";

const key="sj_album_";

function isOwned(id){
  return localStorage.getItem(key+id)==="true";
}

function toggle(id){
  localStorage.setItem(key+id,!isOwned(id));
  render();
}

function unique(arr){
  return [...new Set(arr)].filter(Boolean);
}

function setMain(cat,btn){
  currentCat=cat;
  currentArtist="";
  currentCountry="";
  currentType="";

  document.querySelectorAll("main > .tabs:first-of-type button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setArtist(artist,btn){
  currentArtist=artist;
  currentCountry="";
  currentType="";

  document.querySelectorAll("#artistTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setCountry(country,btn){
  currentCountry=country;
  currentType="";

  document.querySelectorAll("#countryTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  renderTabs();
  render();
}

function setType(type,btn){
  currentType=type;

  document.querySelectorAll("#typeTabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  render();
}

function renderTabs(){
  const artistTabs=document.getElementById("artistTabs");
  const countryTabs=document.getElementById("countryTabs");
  const typeTabs=document.getElementById("typeTabs");

  artistTabs.innerHTML="";
  countryTabs.innerHTML="";
  typeTabs.innerHTML="";

  if(currentCat==="Solo"){
    const soloArtists=["Heechul","Yesung","Eunhyuk","Donghae","Ryeowook","Kyuhyun"];

    artistTabs.innerHTML=soloArtists.map(a=>`
      <button class="${currentArtist===a?'active':''}" onclick="setArtist('${a}',this)">${a}</button>
    `).join("");
  }

  if(currentCat==="Unit"){
    const unitArtists=["K.R.Y.","T","Happy","M","D&E","L.S.S.","83Line"];

    artistTabs.innerHTML=unitArtists.map(a=>`
      <button class="${currentArtist===a?'active':''}" onclick="setArtist('${a}',this)">${a}</button>
    `).join("");
  }

  if(currentCat==="Group"){
    const countries=unique(albums.filter(a=>a.cat==="Group").map(a=>a.country));

    countryTabs.innerHTML=countries.map(c=>`
      <button class="${currentCountry===c?'active':''}" onclick="setCountry('${c}',this)">${c}</button>
    `).join("");
  }

  if(currentArtist){
    const countries=unique(albums
      .filter(a=>a.cat===currentCat && a.artist===currentArtist)
      .map(a=>a.country));

    countryTabs.innerHTML=countries.map(c=>`
      <button class="${currentCountry===c?'active':''}" onclick="setCountry('${c}',this)">${c}</button>
    `).join("");
  }

  if(currentCountry){
    const types=unique(albums
      .filter(a=>
        a.cat===currentCat &&
        (!currentArtist || a.artist===currentArtist) &&
        a.country===currentCountry
      )
      .map(a=>a.type));

    typeTabs.innerHTML=types.map(t=>`
      <button class="${currentType===t?'active':''}" onclick="setType('${t}',this)">${t}</button>
    `).join("");
  }
}

function getList(){
  let list=albums;

  if(currentCat!=="ALL"){
    list=list.filter(a=>a.cat===currentCat);
  }

  if(currentArtist){
    list=list.filter(a=>a.artist===currentArtist);
  }

  if(currentCountry){
    list=list.filter(a=>a.country===currentCountry);
  }

  if(currentType){
    list=list.filter(a=>a.type===currentType);
  }

  return list;
}

function render(){
  const grid=document.getElementById("grid");
  const albumHeader=document.getElementById("albumHeader");

  grid.innerHTML="";
  albumHeader.innerHTML="";

  if(currentCat!=="ALL" && !currentType){
    grid.innerHTML=`<div class="empty">請依序選擇子分類</div>`;
    updateProgress();
    return;
  }

  const list=getList();

  if(list.length===0){
    grid.innerHTML=`<div class="empty">目前沒有資料</div>`;
    updateProgress();
    return;
  }

  if(currentType){
    const albumName=list[0].album;
    const ownedCount=list.filter(a=>isOwned(a.id)).length;
    const totalCount=list.length;
    const albumYear=list[0].year;

    albumHeader.innerHTML=`
      <div class="albumHeader">
        <div class="albumTitle">${albumName.toUpperCase()}</div>
        <div class="albumSub">${currentArtist}｜${currentCountry}｜${currentType}｜${albumYear}</div>
        <div class="albumProgress">${ownedCount} / ${totalCount} Versions</div>
      </div>
    `;
  }

  list.forEach(a=>{
    const owned=isOwned(a.id);

    grid.innerHTML += `
      <div class="card">
        <div class="cover">
          ${
            a.image
            ? `<img src="${a.image}" class="${owned ? 'owned' : ''}">`
            : `${a.album}<br>${a.ver}`
          }
        </div>

        <div class="info">
          <div class="album">${a.ver}</div>
          <div class="meta">${a.album}</div>
          <div class="meta">${a.artist}｜${a.country}｜${a.year}</div>

          <button class="heart ${owned ? 'owned' : ''}" onclick="toggle('${a.id}')">
            ${owned ? '♥ 已收藏' : '♡ 未收藏'}
          </button>
        </div>
      </div>
    `;
  });

  updateProgress();
}

function updateProgress(){
  const total=albums.length;
  const owned=albums.filter(a=>isOwned(a.id)).length;
  const percent=total?Math.round(owned/total*100):0;

  document.getElementById("progressText").innerText=`${owned} / ${total}（${percent}%）`;
  document.getElementById("bar").style.width=percent+"%";
}

renderTabs();
render();
</script>

</body>
</html>
